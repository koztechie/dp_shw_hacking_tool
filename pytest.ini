[pytest]
# АНТИКРИХКІСТЬ: Оптимізація для слабкого заліза (AMD A4, 6GB RAM)
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Маркери для різних типів тестів
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, requires DB)
    performance: Performance tests (resource-intensive)
    e2e: End-to-end tests (full workflow)
    slow: Tests that take more than 5 seconds
    requires_api: Tests that require external API access

# АНТИКРИХКІСТЬ: Обмеження ресурсів
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=65
    -x
    --maxfail=3

# АНТИКРИХКІСТЬ: Таймаути для запобігання зависанням
timeout = 60
timeout_method = signal

# Фільтри для ігнорування попереджень
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
